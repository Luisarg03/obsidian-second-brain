[project]
name = "obsidian-second-brain"
version = "0.2.0"
description = "OKF v0.1 knowledge bundle living in an Obsidian vault, consumed by LLM agents on demand."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "aiosqlite",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
okf-validate = "scripts.okf_validate:main"
okf-migrate = "scripts.okf_migrate:main"
rebuild-index = "scripts.rebuild_index:main"
digest-session = "scripts.digest_session:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_server", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
